<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Aero - QR Code Generator Pro</title>
    <!-- Importando a fonte Segoe UI para autenticidade Aero -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1c2636 0%, #080b10 100%);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de brilho de fundo Aero / Aurora */
        body::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(0, 162, 232, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }

        /* Janela Dark Aero Glassmorphism */
        .aero-window {
            background: rgba(18, 22, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2); /* Brilho especular superior */
            border-radius: 12px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 26px;
            position: relative;
            overflow: hidden;
        }

        /* Reflexo de luz translúcido na janela */
        .aero-window::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            border-radius: 12px 12px 0 0;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 12px;
            color: #8b9bb4;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 14px;
            position: relative;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #a3b8cc;
            margin-bottom: 5px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        input[type="text"], select {
            width: 100%;
            background: rgba(10, 13, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        select option {
            background: #12161e;
            color: #fff;
        }

        input[type="text"]:focus, select:focus {
            border-color: rgba(0, 162, 232, 0.6);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(0, 162, 232, 0.4);
            background: rgba(10, 13, 18, 0.8);
        }

        /* Grade de personalização (Cores e Opções Avançadas) */
        .customization-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            background: rgba(10, 13, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .color-picker-wrapper:focus-within {
            border-color: rgba(0, 162, 232, 0.6);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(0, 162, 232, 0.4);
            background: rgba(10, 13, 18, 0.8);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            margin-right: 8px;
            flex-shrink: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .color-text-input {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            color: #d0dbe5 !important;
            font-size: 12px !important;
            width: 100%;
            outline: none;
        }

        /* Área do QR Code */
        .qr-output-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            transition: all 0.4s ease;
        }

        .qr-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
            margin-bottom: 14px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            min-width: 180px;
        }

        .qr-box img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .placeholder-text {
            color: #4a5568;
            font-size: 12px;
            text-align: center;
            position: absolute;
        }

        /* Botões de Ação Aero Style */
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: linear-gradient(to bottom, rgba(50, 60, 78, 0.8) 0%, rgba(30, 38, 52, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 9px 14px;
            color: #e0e6ed;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-shadow: 0 1px 1px rgba(0,0,0,0.6);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover {
            background: linear-gradient(to bottom, rgba(65, 78, 102, 0.9) 0%, rgba(40, 50, 68, 0.9) 100%);
            border-color: rgba(0, 162, 232, 0.4);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 162, 232, 0.2), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn:active {
            transform: translateY(1px);
            background: linear-gradient(to bottom, rgba(20, 26, 36, 0.9) 0%, rgba(30, 38, 52, 0.9) 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .btn-primary {
            background: linear-gradient(to bottom, rgba(0, 120, 215, 0.9) 0%, rgba(0, 90, 160, 0.9) 100%);
            border-color: rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(to bottom, rgba(0, 140, 250, 0.95) 0%, rgba(0, 105, 185, 0.95) 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .hidden {
            display: none !important;
        }

        .footer-note {
            margin-top: 14px;
            font-size: 11px;
            color: #5c6c84;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="aero-window">
            <h1>QR Code Generator</h1>
            <p class="subtitle">Personalize cores e formato instantaneamente</p>

            <div class="input-group">
                <label for="urlInput">URL ou Texto de Destino</label>
                <input type="text" id="urlInput" placeholder="https://exemplo.com" autocomplete="off" spellcheck="false">
            </div>

            <div class="customization-grid">
                <div class="input-group" style="margin-bottom:0;">
                    <label>Cor dos Blocos</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="fgColorPicker" value="#121620">
                        <input type="text" id="fgColorText" class="color-text-input" value="#121620" maxlength="7" autocomplete="off" spellcheck="false">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom:0;">
                    <label>Cor de Fundo</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColorPicker" value="#ffffff">
                        <input type="text" id="bgColorText" class="color-text-input" value="#ffffff" maxlength="7" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </div>

            <div class="customization-grid" style="margin-top: 14px;">
                <div class="input-group" style="margin-bottom:0;">
                    <label for="formatSelect">Formato do Arquivo</label>
                    <select id="formatSelect">
                        <option value="png">PNG (Padrão)</option>
                        <option value="jpg">JPG</option>
                        <option value="webp">WEBP</option>
                        <option value="svg">SVG (Vetor)</option>
                    </select>
                </div>

                <div class="input-group" style="margin-bottom:0;">
                    <label for="sizeSelect">Resolução</label>
                    <select id="sizeSelect">
                        <option value="200">200 x 200 px</option>
                        <option value="300" selected>300 x 300 px</option>
                        <option value="500">500 x 500 px</option>
                        <option value="800">800 x 800 px</option>
                    </select>
                </div>
            </div>

            <div class="qr-output-container">
                <div class="qr-box" id="qrBox">
                    <span class="placeholder-text" id="placeholderText">Aguardando link...</span>
                    <img id="qrImage" class="hidden" alt="QR Code gerado">
                </div>

                <div class="actions" id="actionButtons" style="display: none;">
                    <button class="btn" id="copyBtn">Copiar</button>
                    <a id="downloadBtn" class="btn btn-primary" download="qrcode.png">Baixar</a>
                </div>
            </div>

            <div class="footer-note">Copyleft | All wrongs reserved</div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const fgColorPicker = document.getElementById('fgColorPicker');
        const fgColorText = document.getElementById('fgColorText');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const bgColorText = document.getElementById('bgColorText');
        const formatSelect = document.getElementById('formatSelect');
        const sizeSelect = document.getElementById('sizeSelect');

        const qrBox = document.getElementById('qrBox');
        const qrImage = document.getElementById('qrImage');
        const placeholderText = document.getElementById('placeholderText');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');

        let debounceTimer;

        // Sincronização e eventos para Foreground (Cor dos Blocos)
        fgColorPicker.addEventListener('input', () => {
            fgColorText.value = fgColorPicker.value;
            triggerUpdate();
        });

        fgColorText.addEventListener('input', () => {
            let val = fgColorText.value.trim();
            if (!val.startsWith('#')) {
                val = '#' + val;
            }
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                fgColorPicker.value = val;
                triggerUpdate();
            }
        });

        // Sincronização e eventos para Background (Cor de Fundo)
        bgColorPicker.addEventListener('input', () => {
            bgColorText.value = bgColorPicker.value;
            triggerUpdate();
        });

        bgColorText.addEventListener('input', () => {
            let val = bgColorText.value.trim();
            if (!val.startsWith('#')) {
                val = '#' + val;
            }
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                bgColorPicker.value = val;
                triggerUpdate();
            }
        });

        formatSelect.addEventListener('change', triggerUpdate);
        sizeSelect.addEventListener('change', triggerUpdate);
        urlInput.addEventListener('input', triggerUpdate);

        function triggerUpdate() {
            clearTimeout(debounceTimer);
            const text = urlInput.value.trim();

            if (!text) {
                resetQRCode();
                return;
            }

            debounceTimer = setTimeout(() => {
                generateQRCode(text);
            }, 250);
        }

        function generateQRCode(data) {
            const encodedData = encodeURIComponent(data);
            const colorHex = fgColorPicker.value.replace('#', '');
            const bgHex = bgColorPicker.value.replace('#', '');
            const format = formatSelect.value;
            const size = sizeSelect.value;

            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodedData}&color=${colorHex}&bgcolor=${bgHex}&format=${format}`;

            qrImage.src = apiUrl;
            
            qrImage.onload = () => {
                placeholderText.classList.add('hidden');
                qrImage.classList.remove('hidden');
                actionButtons.style.display = 'flex';
                
                downloadBtn.href = apiUrl;
                downloadBtn.download = `qrcode.${format}`;
            };
        }

        function resetQRCode() {
            qrImage.src = '';
            qrImage.classList.add('hidden');
            placeholderText.classList.remove('hidden');
            actionButtons.style.display = 'none';
        }

        copyBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(qrImage.src);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = 'Copiado!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            } catch (err) {
                alert('Não foi possível copiar diretamente. Tente usar o botão de baixar.');
            }
        });
    </script>
</body>
</html>
